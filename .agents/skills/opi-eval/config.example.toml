# Copy with evaluate.py init; edit only the private .opi/eval.toml.
schema = "opi-eval-operator/1"

[model]
provider = "zhipu"
model = "glm-5.3-flash"
api = "anthropic-messages"
base_url = "https://open.bigmodel.cn/api/anthropic"
credential_env = "ZHIPU_API_KEY"
# Exactly one credential source: credential_env, credential_file (absolute), api_key.
# api_key belongs only in the ignored private profile, never in this template.

[model.controls]
context_window = 1000000
max_output_tokens = 131072
temperature = "omitted"
top_p = "omitted"

[model.thinking]
# Supported native levels: off, minimal, low, medium, high. Unsupported required
# levels (including xhigh/max) reject; non-off levels require budget + 1024 tokens.
level = "off"
required = true

[execution]
trial_retries = 2
batch_timeout_seconds = 3600
concurrency = 1
capture_policy = "full"

[benchmarks.tb21]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[benchmarks.tb30]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[benchmarks.deepswe]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[baseline]
pi_version = "1.0.0"
lookup = "auto"

[storage]
# Native prepare/run requires Linux x86_64 and Docker. Choose external Linux paths.
workspace = "/home/luiz/.local/state/opi-eval"
cache = "/home/luiz/.cache/opi-eval"
