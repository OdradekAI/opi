interface:
  display_name: "Opi Realign"
  short_description: "Review snapshot parity, architecture, and acceptance"
  default_prompt: "Use $opi-realign target=<snapshot-path> to compare Opi with that pi snapshot for complete capability and observable-behavior reproduction. Report invocation and parameter differences, architecture findings, conditional gap-closing approaches, and acceptance criteria without using Opi plans or prior audits to constrain the assessment."
policy:
  allow_implicit_invocation: false
