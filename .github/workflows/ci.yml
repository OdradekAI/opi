name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # Phase 15 task 15.5.6: scoped strict-sandbox product acceptance on the three
  # native release OSes. Runs ONLY the named cfg-gated acceptance tests per
  # platform (plus the Linux alternate-network-surface audit) so the job's
  # pass signal maps directly to the DoD clause "each native job executes >=1
  # passed platform test with zero failures and zero ignored/skipped". These
  # binaries have no `#[ignore]` tests, so a green run is zero-ignored by
  # construction. Log artifact retained per DoD. The full-workspace `test`
  # matrix above remains unchanged; any pre-existing workspace-test debt is
  # Phase 15 carry-over, not owned by 15.5.6.
  sandbox_product:
    name: Sandbox product (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: linux_engaged_subprocess_denies_requested_access
            extra: --test sandbox_linux_backend linux_alternate_network_surface_audit
          - os: macos-latest
            tests: macos_engaged_subprocess_denies_outside_write macos_engaged_subprocess_denies_network macos_engaged_subprocess_allows_workspace_and_temp_writes
            extra: ""
          - os: windows-latest
            tests: windows_strict_production_dispatch_reports_l0_only
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scoped sandbox acceptance tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p logs
          LOG="logs/sandbox-product-${{ matrix.os }}.log"
          : > "$LOG"
          status=0
          # matrix.tests is a space-separated list of exact test names; cargo
          # test takes a single TESTNAME filter, so run each in its own
          # invocation and aggregate the exit status. No #[ignore] in these
          # binaries -> a green run is zero-failures zero-ignored by
          # construction.
          for t in ${{ matrix.tests }}; do
            cargo test -p opi-coding-agent --test sandbox_strict --no-fail-fast "$t" \
              2>&1 | tee -a "$LOG" || status=$?
          done
          if [ -n "${{ matrix.extra }}" ]; then
            cargo test -p opi-coding-agent --no-fail-fast ${{ matrix.extra }} \
              2>&1 | tee -a "$LOG" || status=$?
          fi
          exit $status
      - name: Upload sandbox-product log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-product-${{ matrix.os }}
          path: logs/

  # Phase 15 task 15.5.6: compile-check the production sandbox selection path
  # for all six supported release triples. The runner OS is matched to the
  # target family (mirrors release.yml) so the host C toolchain matches:
  # linux-gnu -> ubuntu, apple-darwin -> macos (Apple clang -arch handles the
  # other arch natively), windows-msvc -> windows. aarch64-unknown-linux-gnu
  # additionally needs a cross C compiler because `cargo check` still runs
  # build scripts (ring's build.rs compiles C with cc-rs), so install
  # gcc-aarch64-linux-gnu and point cc-rs at it. RUSTFLAGS=-D warnings
  # (workflow env) denies warnings across all targets.
  target_check:
    name: Target check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_gcc: aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross C toolchain (aarch64-linux only)
        if: matrix.cross_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cargo check opi-coding-agent for ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        shell: bash
        run: cargo check --target ${{ matrix.target }} -p opi-coding-agent --all-targets
