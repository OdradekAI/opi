name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  docs_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/opi-doc-check.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  # Phase 16 execution acceptance is feature-gated because it drives the real
  # process-JSONL host against a harness-free mock peer. Build that peer first
  # in the same job so all three suites can locate it in the shared deps dir.
  execution_acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build execution backend mock
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_backend_mock --no-run
      - name: Run execution product acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_product
      - name: Run execution protocol host acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_protocol_host
      - name: Run execution runtime acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_runtime

  # Phase 17 task 17.9: hermetic cross-mode / failure-rollback / api-audit
  # acceptance. Platform-neutral (no OS-specific permission or confinement);
  # identical selection on Linux, macOS, and Windows. Uses local MockProvider
  # fixtures and in-repo source/CI audits — no network, no subprocess peer, no
  # feature flag. Job and step names stay literal because phase17_api_audit
  # reads this file to prove the three-platform contract.
  phase17_acceptance:
    name: Phase 17 acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run phase17 cross-mode acceptance
        run: cargo test -p opi-coding-agent --test phase17_cross_mode
      - name: Run phase17 failure-rollback acceptance
        run: cargo test -p opi-coding-agent --test phase17_failure_rollback
      - name: Run phase17 api-audit acceptance
        run: cargo test -p opi-coding-agent --test phase17_api_audit

  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --doc

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # Phase 16 task 16.15.2: native opi-sandbox package + extracted-binary smoke
  # on the two native release OSes that ship an opi-sandbox archive
  # (x86_64-unknown-linux-gnu on ubuntu-latest, aarch64-apple-darwin on
  # macos-latest). Windows has no native opi-sandbox confinement (16.14.2
  # unsupported posture), so it is intentionally absent. The 16.15.1 packager
  # detects the HOST triple, so only native-runner triples are built here
  # (cross-arch packaging is a 16.15.1 follow-up, out of scope for 16.15.2).
  # Smoke runs against the EXTRACTED archive binary, never a bare workspace
  # target/ binary. Replaces the Phase 15 sandbox_product job, which ran
  # sandbox_strict/sandbox_linux_backend tests that 16.16.1 deletes from the
  # core crate.
  sandbox_package:
    name: opi-sandbox package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build opi-sandbox release binary
        run: cargo build --release -p opi-sandbox --bin opi-sandbox
      - name: Package native archive
        shell: bash
        run: |
          bash scripts/package-opi-sandbox.sh \
            --binary target/release/opi-sandbox \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }}
      - name: Verify native archive
        shell: bash
        run: |
          bash scripts/package-opi-sandbox.sh \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }} \
            --verify
      - name: Standalone smoke (extracted archive, no opi on PATH)
        shell: bash
        run: |
          bash scripts/opi-sandbox-smoke.sh \
            --binary target/opi-artifacts/ci-${{ matrix.os }}/extracted/bin/opi-sandbox \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }}/smoke \
            --archive target/opi-artifacts/ci-${{ matrix.os }}/opi-sandbox-*.tar.gz

  # Six-target opi-coding-agent compile gate (retained by task 16.15.2). Compiles
  # every supported release triple so a cross-target break surfaces on PR, not
  # only at tag-time release.yml. The runner OS is matched to the target family
  # (mirrors release.yml) so the host C toolchain matches: linux-gnu -> ubuntu,
  # apple-darwin -> macos (Apple clang -arch handles the other arch natively),
  # windows-msvc -> windows. aarch64-unknown-linux-gnu additionally needs a
  # cross C compiler because `cargo check` still runs build scripts (ring's
  # build.rs compiles C with cc-rs), so install gcc-aarch64-linux-gnu and point
  # cc-rs at it. RUSTFLAGS=-D warnings (workflow env) denies warnings across all
  # targets.
  target_check:
    name: Target check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_gcc: aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross C toolchain (aarch64-linux only)
        if: matrix.cross_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cargo check opi-coding-agent for ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        shell: bash
        run: cargo check --target ${{ matrix.target }} -p opi-coding-agent --all-targets

  # Phase 18 task 18.16: minimal pull-request attestation producer. It
  # records the pull-request head SEPARATELY from the merge-ref checkout
  # every ordinary job uses, adds evidence without replacing any merge-ref
  # integration check with head-only validation, and never checks the head
  # out. The receipt is the input contract of
  # scripts/verify-phase18-ci.py (task 18.16.1). Job and matrix shape are
  # pinned by that verifier's static mode.
  phase18_attestation:
    name: Phase 18 attestation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record attestation receipt
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          "$PY" - "$PR_HEAD" <<'PYEOF'
          import hashlib, json, os, sys

          pr_head = sys.argv[1] if len(sys.argv) > 1 and sys.argv[1] else None
          workflow_path = ".github/workflows/ci.yml"
          workflow_bytes = open(workflow_path, "rb").read()
          receipt = {
              "schema": "phase18-ci-attestation/1",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "merge_commit": os.environ["GITHUB_SHA"],
              "pull_request_head": pr_head,
              "workflow_path": workflow_path,
              "workflow_sha256": hashlib.sha256(workflow_bytes).hexdigest(),
              "runner_os": os.environ["RUNNER_OS"],
              "required_jobs": [
                  "docs_contract", "fmt", "clippy", "test",
                  "execution_acceptance", "phase17_acceptance",
                  "doctest", "doc", "sandbox_package", "target_check",
                  "phase18_attestation",
              ],
              "attestation_commit": os.environ["GITHUB_SHA"],
          }
          with open("phase18-attestation-receipt.json", "w", encoding="utf-8") as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PYEOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase18-attestation-${{ matrix.os }}
          path: phase18-attestation-receipt.json
          if-no-files-found: error
