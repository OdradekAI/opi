name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  docs_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: python3 scripts/opi-doc-check.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo test --workspace --all-targets --locked

  # Phase 16 execution acceptance is feature-gated because it drives the real
  # process-JSONL host against a harness-free mock peer. Build that peer first
  # in the same job so all three suites can locate it in the shared deps dir.
  execution_acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Build execution backend mock
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_backend_mock --no-run
      - name: Run execution product acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_product
      - name: Run execution protocol host acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_protocol_host
      - name: Run execution runtime acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_runtime

  # Offline runtime acceptance uses the same targets on all three platforms.
  # ci_contract checks this selection; test_hermeticity audits fixture sources.
  phase17_acceptance:
    name: Phase 17 acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Run cross-mode acceptance
        run: cargo test -p opi-coding-agent --test cross_mode_runtime
      - name: Run failure-recovery acceptance
        run: cargo test -p opi-coding-agent --test runtime_failure_recovery
      - name: Run architecture guards
        run: cargo test -p opi-coding-agent --test architecture_guards
      - name: Run offline test guards
        run: cargo test -p opi-coding-agent --test test_hermeticity
      - name: Run CI contract guards
        run: cargo test -p opi-coding-agent --test ci_contract

  # Task 20.58: the workspace declares MSRV 1.97 (edition 2024). The local
  # delivery evidence ran the full Linux suite on exactly rustc 1.97.1; CI
  # re-checks every push so an unpinned dependency bump that breaks the
  # declared MSRV fails here before release.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo test --workspace --doc --locked

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: cargo doc --workspace --no-deps --locked

  # Phase 16 task 16.15.2: native opi-sandbox package + extracted-binary smoke
  # on the two native release OSes that ship an opi-sandbox archive
  # (x86_64-unknown-linux-gnu on ubuntu-latest, aarch64-apple-darwin on
  # macos-latest). Windows has no native opi-sandbox confinement (16.14.2
  # unsupported posture), so it is intentionally absent. The 16.15.1 packager
  # detects the HOST triple, so only native-runner triples are built here
  # (cross-arch packaging is a 16.15.1 follow-up, out of scope for 16.15.2).
  # Smoke runs against the EXTRACTED archive binary, never a bare workspace
  # target/ binary. Replaces the Phase 15 sandbox_product job, which ran
  # sandbox_strict/sandbox_linux_backend tests that 16.16.1 deletes from the
  # core crate.
  sandbox_package:
    name: opi-sandbox package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Build opi-sandbox release binary
        run: cargo build --release -p opi-sandbox --bin opi-sandbox
      - name: Package native archive
        shell: bash
        run: |
          bash crates/opi-sandbox/scripts/package-opi-sandbox.sh \
            --binary target/release/opi-sandbox \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }}
      - name: Verify native archive
        shell: bash
        run: |
          bash crates/opi-sandbox/scripts/package-opi-sandbox.sh \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }} \
            --verify
      - name: Standalone smoke (extracted archive, no opi on PATH)
        shell: bash
        run: |
          bash crates/opi-sandbox/scripts/opi-sandbox-smoke.sh \
            --binary target/opi-artifacts/ci-${{ matrix.os }}/extracted/bin/opi-sandbox \
            --artifact-dir target/opi-artifacts/ci-${{ matrix.os }}/smoke \
            --archive target/opi-artifacts/ci-${{ matrix.os }}/opi-sandbox-*.tar.gz

  # Six-target opi-coding-agent compile gate (retained by task 16.15.2). Compiles
  # every supported release triple so a cross-target break surfaces on PR, not
  # only at tag-time release.yml. The runner OS is matched to the target family
  # (mirrors release.yml) so the host C toolchain matches: linux-gnu -> ubuntu,
  # apple-darwin -> macos (Apple clang -arch handles the other arch natively),
  # windows-msvc -> windows. aarch64-unknown-linux-gnu additionally needs a
  # cross C compiler because `cargo check` still runs build scripts (ring's
  # build.rs compiles C with cc-rs), so install gcc-aarch64-linux-gnu and point
  # cc-rs at it. RUSTFLAGS=-D warnings (workflow env) denies warnings across all
  # targets.
  target_check:
    name: Target check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross_gcc: aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cross C toolchain (aarch64-linux only)
        if: matrix.cross_gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: cargo check opi-coding-agent for ${{ matrix.target }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        shell: bash
        run: cargo check --target ${{ matrix.target }} -p opi-coding-agent --all-targets
