name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      windows: ${{ steps.scope.outputs.windows }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/opi-ci-scope.py scope --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
      - run: python3 scripts/opi-doc-check.py
      - run: python3 scripts/test_opi_ci_scope.py
      - run: python3 .agents/skills/opi-implement/scripts/test_opi_impl_smoke.py

  product:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: product-linux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude opi-eval --all-targets --locked
      - run: cargo test --workspace --exclude opi-eval --all-targets --locked
      # This feature changes the test configuration; default workspace tests
      # do not replace the process-JSONL host's mock-peer acceptance.
      - name: Build execution backend mock
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_backend_mock --no-run --locked
      - name: Run execution acceptance
        run: cargo test -p opi-coding-agent --features execution-backend-test-fixture --test execution_product --test execution_protocol_host --test execution_runtime --locked
      - run: cargo test --workspace --exclude opi-eval --doc --locked
      - run: cargo doc --workspace --exclude opi-eval --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: product-msrv
      - run: cargo check --workspace --exclude opi-eval --all-targets --locked

  platforms:
    needs: scope
    if: needs.scope.outputs.windows == 'true' || needs.scope.outputs.macos == 'true'
    uses: ./.github/workflows/platform-verify.yml
    with:
      ref: ${{ github.sha }}
      linux: false
      windows: ${{ needs.scope.outputs.windows == 'true' }}
      macos: ${{ needs.scope.outputs.macos == 'true' }}
      suite: smoke

  required:
    if: always()
    needs: [scope, product, msrv, platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          SCOPE: ${{ needs.scope.result }}
          RUST: ${{ needs.scope.outputs.rust }}
          PRODUCT: ${{ needs.product.result }}
          MSRV: ${{ needs.msrv.result }}
          WINDOWS: ${{ needs.scope.outputs.windows }}
          MACOS: ${{ needs.scope.outputs.macos }}
          PLATFORMS: ${{ needs.platforms.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = success
          for selected in "$RUST" "$WINDOWS" "$MACOS"; do
            case "$selected" in true|false) ;; *) exit 1 ;; esac
          done
          if [ "$RUST" = true ]; then
            test "$PRODUCT" = success
            test "$MSRV" = success
          fi
          if [ "$WINDOWS" = true ] || [ "$MACOS" = true ]; then
            test "$PLATFORMS" = success
          fi
