name: mac-stabilize

# Focused macOS-only verification for stabilizing opi-sandbox / native_keyring /
# execution-acceptance tests that cannot be reproduced on the Windows dev host.
# Manual dispatch only (does not gate main); the full matrix is covered by ci.yml.

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: focused json_mode diagnosis
        run: |
          cargo test -p opi-coding-agent --test json_mode --no-fail-fast -- --nocapture --test-threads=1
