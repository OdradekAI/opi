name: Phase 20 isolated native package verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-sdk-package:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: phase20-native-package
      - name: Verify immutable source package and actual public consumers
        run: >-
          python3 .assurance/phase20/native_ready_proof.py
          --repository "$GITHUB_WORKSPACE"
          --head e433ac833a28ece771ec8dbb00f947efbd592055
          --out "$RUNNER_TEMP/phase20-native-proof"
          --prime-registry
      - name: Retain original package, consumer, graph and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase20-native-sdk-package-macos
          path: ${{ runner.temp }}/phase20-native-proof
          retention-days: 7
