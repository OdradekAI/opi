name: Phase 18 Linux native smoke

# Manually authorized producer for the Phase 18 Linux x86_64 native smoke
# (task 18.14). This is not an every-PR job and never a normal Opi startup
# path: it executes the sole committed producer contract once per dispatch,
# strictly sequentially, and fails closed when the running workflow bytes,
# any invoked producer script, or the dispatch candidate commit have
# drifted. Task 18.15 dispatches it against the resolved native material;
# this file only commits and binds the contract.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact producer-contract commit (task 18.14.1 lineage) this dispatch runs"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase18-linux-native-smoke
  cancel-in-progress: false

# The stage root is exported from the first step through GITHUB_ENV:
# the runner context is not available in a workflow-level env block,
# and every later step (run blocks and upload paths) reads the variable
# from the step environment instead.

jobs:
  native_smoke:
    if: github.repository == 'OdradekAI/opi'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Prepare the isolated stage root
        run: |
          set -euo pipefail
          echo "PHASE18_NATIVE_STAGE=$RUNNER_TEMP/phase18-native" >> "$GITHUB_ENV"

      - name: Check out the candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      # The dispatch receipt binds github.workflow_ref / github.workflow_sha,
      # the SHA-256 of the workflow bytes read from that workflow SHA (not
      # from the mutable working tree), the candidate_sha, every invoked
      # script digest, the immutable action pins, and the compiled opi-eval
      # producer digest, before any agent runs.
      - name: Verify the dispatch contract
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh verify-dispatch \
            --candidate-sha "$CANDIDATE" \
            --workflow-path .github/workflows/phase18-native-smoke.yml \
            --workflow-sha "$WORKFLOW_SHA" \
            --workflow-ref "$WORKFLOW_REF" \
            --out "$PHASE18_NATIVE_STAGE/00-dispatch"

      # Hosted-runner labels are evidence of one run, not a permanent host
      # lock: the exact runner image, kernel, resources, cgroup mode, and
      # Docker/BuildKit identities are captured into the stage receipt.
      - name: Record the host identity
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh host-identity \
            --out "$PHASE18_NATIVE_STAGE/01-host"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0
        with:
          toolchain: 1.97.0

      - name: Install the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0

      - name: Install the pinned uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          version: 0.9.7
          enable-cache: false

      - name: Set up the pinned Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Record the resolved tool identities
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh record-tools \
            --out "$PHASE18_NATIVE_STAGE/02-tools" \
            --buildx-image digest-pinned-by-setup-buildx

      # Every external repository is fetched at its full pinned commit and
      # its complete tree digest is verified; mutable refs, tags as identity,
      # and tree drift fail closed. The receipt is the adapter-source
      # manifest for all three benchmark revisions and both runners.
      - name: Fetch and verify the pinned external sources
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh fetch-external \
            --external-root "$PHASE18_NATIVE_STAGE/03-external" \
            --out "$PHASE18_NATIVE_STAGE/03-external"

      # Builds Opi and pi through the exact build/locator script: Opi from a
      # locked release build selected by compiler-artifact executable (never
      # an assumed target path), pi from a locked source build; both with
      # full executable, runtime, and input identities.
      - name: Build and locate both agents
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh build-agents \
            --build-script scripts/phase18-build-agent-artifacts.sh \
            --pi-source "$PHASE18_NATIVE_STAGE/03-external/pi" \
            --out "$PHASE18_NATIVE_STAGE/04-agents"

      # The scripted provider runs through the canonical Python executable in
      # isolated no-site mode with one pre-resolved listener endpoint on one
      # dedicated Docker network. Verifier phases, ambient credentials,
      # undeclared listeners, default routes, and outbound fallback are
      # absent; probes prove only the admitted Agent-phase task containers
      # reach the endpoint.
      - name: Start the isolated scripted provider
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh provider-up \
            --provider scripts/phase18-scripted-provider.py \
            --network phase18-provider-net \
            --out "$PHASE18_NATIVE_STAGE/05-provider"

      - name: Probe the provider reachability boundary
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh provider-probe \
            --network phase18-provider-net \
            --out "$PHASE18_NATIVE_STAGE/05-provider"

      # Canary-oracle preflight (P18-BMK-003): before any Agent trial, probe
      # the projected Agent-phase environments, mounts, configuration, and
      # scripted-provider response paths for the pinned oracle and
      # reference-solution material by digest and canary markers. The
      # required negative result is recorded in the outer receipt; a positive
      # hit stops the producer before any dispatch.
      - name: Run the canary-oracle preflight
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh preflight-canaries \
            --external-root "$PHASE18_NATIVE_STAGE/03-external" \
            --provider scripts/phase18-scripted-provider.py \
            --out "$PHASE18_NATIVE_STAGE/06-canaries"

      # Materializes the resolved-material manifest, the launch wrappers,
      # and the three experiment configs with pinned integrity digests
      # bound to the fetched sources, built agents, and provider endpoint.
      - name: Materialize the native material and experiment configs
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh materialize-configs \
            --external-root "$PHASE18_NATIVE_STAGE/03-external" \
            --agents-out "$PHASE18_NATIVE_STAGE/04-agents" \
            --provider-out "$PHASE18_NATIVE_STAGE/05-provider" \
            --out "$PHASE18_NATIVE_STAGE/06-material"

      # Reruns the task 18.10.1 shared AgentExecution and
      # BenchmarkExecution conformance suites through the exact built
      # Opi/pi programs and all three exact native revisions (admitted
      # native case subset; failure-injection cases stay hermetic).
      - name: Rerun the conformance suites through the exact programs
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh conformance-rerun \
            --material "$PHASE18_NATIVE_STAGE/06-material/material.json" \
            --out "$PHASE18_NATIVE_STAGE/06-material/conformance"

      # One upstream oracle preflight per selected task: the official
      # reference solution must pass through the unchanged native verifier
      # before any agent trial starts.
      - name: Run the upstream oracle preflights
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh oracle-preflight \
            --material "$PHASE18_NATIVE_STAGE/06-material/material.json" \
            --config-root "$PHASE18_NATIVE_STAGE/06-material" \
            --out "$PHASE18_NATIVE_STAGE/06-material/oracle"

      # Six paired trials (Opi and pi for each of the three pinned task
      # packages) through the native driving mode of the opi-eval run CLI,
      # preserving native verifier authority and typed trajectory/span
      # source edges, with the canary markers gating the seal.
      - name: Run the six paired agent trials
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh run-trials \
            --config-root "$PHASE18_NATIVE_STAGE/06-material" \
            --material "$PHASE18_NATIVE_STAGE/06-material/material.json" \
            --canary-out "$PHASE18_NATIVE_STAGE/06-canaries" \
            --out "$PHASE18_NATIVE_STAGE/07-trials"

      - name: Stop the provider and network
        if: always()
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh provider-down \
            --network phase18-provider-net \
            --out "$PHASE18_NATIVE_STAGE/05-provider"

      # Seals the audited artifact, runs the canary/redaction and
      # package/artifact audits, emits the sorted SHA-256 manifest and the
      # outer seal/upload receipt, and hands the artifact digest to the
      # upload step. Safe diagnostics only; nothing is uploaded before
      # redaction and sealing succeed.
      - name: Seal and audit the native artifact
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh seal-upload \
            --stage-root "$PHASE18_NATIVE_STAGE" \
            --out "$PHASE18_NATIVE_STAGE/08-seal"

      - name: Upload the sealed native artifact
        id: upload
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase18-native-smoke
          path: ${{ runner.temp }}/phase18-native/08-seal/sealed-artifact.tar
          if-no-files-found: error
          retention-days: 90

      # The post-upload identity receipt binds the artifact id, url,
      # digest, run identity, and expiry without self-reference; it is
      # uploaded as its own small artifact for the 18.15 verifier.
      - name: Record and upload the upload-identity receipt
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/phase18-native-smoke.sh record-upload-identity \
            --seal-out "$PHASE18_NATIVE_STAGE/08-seal" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-url "$ARTIFACT_URL" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --retention-days 90 \
            --out "$PHASE18_NATIVE_STAGE/09-upload"
      - name: Upload the upload-identity receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase18-native-smoke-upload-receipt
          path: ${{ runner.temp }}/phase18-native/09-upload/upload-receipt.json
          if-no-files-found: error
          retention-days: 90
