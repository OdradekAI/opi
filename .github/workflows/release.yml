name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: opi-linux-x64
            ext: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: opi-linux-arm64
            ext: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: opi-darwin-x64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: opi-darwin-arm64
            ext: tar.gz
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: opi-windows-x64
            ext: zip
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: opi-windows-arm64
            ext: zip
            tier2: true

    runs-on: ${{ matrix.os }}
    # windows-arm64 is a Tier-2 target; a build break omits its artifact
    # rather than failing the whole release.
    continue-on-error: ${{ matrix.tier2 == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p opi-coding-agent

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p opi-coding-agent

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/opi"
          [ "${{ matrix.ext }}" = "zip" ] && bin="$bin.exe"
          "$bin" --version

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz opi
        shell: bash

      - name: Package (windows)
        if: matrix.ext == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip opi.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  # Phase 16 task 16.15.2: every supported opi-sandbox archive is built and
  # smoked on a host-native runner. Windows remains an explicitly unsupported
  # posture and therefore produces evidence, but no opi-sandbox archive.
  sandbox_archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos
          - target: aarch64-apple-darwin
            os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: opi-sandbox-${{ matrix.target }}

      - name: Build opi-sandbox release binary
        run: cargo build --release --target ${{ matrix.target }} -p opi-sandbox --bin opi-sandbox

      - name: Package native archive
        shell: bash
        run: |
          bash scripts/package-opi-sandbox.sh \
            --binary target/${{ matrix.target }}/release/opi-sandbox \
            --artifact-dir target/opi-artifacts/${{ matrix.target }}

      - name: Standalone smoke (extracted archive, no opi on PATH)
        shell: bash
        run: |
          bash scripts/opi-sandbox-smoke.sh \
            --binary target/opi-artifacts/${{ matrix.target }}/extracted/bin/opi-sandbox \
            --artifact-dir target/opi-artifacts/${{ matrix.target }}/smoke \
            --archive target/opi-artifacts/${{ matrix.target }}/opi-sandbox-${{ matrix.target }}.tar.gz

      - name: Upload opi-sandbox archive
        uses: actions/upload-artifact@v4
        with:
          name: opi-sandbox-${{ matrix.target }}
          path: target/opi-artifacts/${{ matrix.target }}/opi-sandbox-${{ matrix.target }}.tar.gz

      - name: Upload opi-sandbox release evidence
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-evidence-${{ matrix.target }}
          path: |
            target/opi-artifacts/${{ matrix.target }}/opi-sandbox-${{ matrix.target }}.tar.gz
            target/opi-artifacts/${{ matrix.target }}/package-lock.toml
            target/opi-artifacts/${{ matrix.target }}/target
            target/opi-artifacts/${{ matrix.target }}/smoke

  sandbox_windows_posture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sandbox-windows-posture

      - name: Capture unsupported Windows posture
        shell: pwsh
        run: |
          $evidence = "target/opi-artifacts/windows"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          cargo run --quiet -p opi-sandbox -- doctor --json 2>&1 |
            Tee-Object -FilePath "$evidence/unsupported.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p opi-coding-agent --test windows_execution_posture 2>&1 |
            Tee-Object -FilePath "$evidence/posture-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows posture evidence
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-evidence-windows
          path: target/opi-artifacts/windows

  sandbox_release_audit:
    needs: [sandbox_archive, sandbox_windows_posture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-x86_64-unknown-linux-gnu
          path: evidence/linux/x86_64-unknown-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-aarch64-unknown-linux-gnu
          path: evidence/linux/aarch64-unknown-linux-gnu

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-x86_64-apple-darwin
          path: evidence/macos/x86_64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-aarch64-apple-darwin
          path: evidence/macos/aarch64-apple-darwin

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-evidence-windows
          path: evidence/windows

      - name: Audit the complete release evidence set
        run: python3 scripts/opi-artifact-audit.py evidence --release

  release:
    needs: [build, sandbox_archive, sandbox_release_audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: opi-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum opi-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release upload "${RELEASE_TAG}" \
            opi-* \
            SHA256SUMS.txt \
            --clobber
