name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: opi-linux-x64
            ext: tar.gz
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: opi-linux-arm64
            ext: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: opi-darwin-x64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: opi-darwin-arm64
            ext: tar.gz
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: opi-windows-x64
            ext: zip
            smoke: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: opi-windows-arm64
            ext: zip
            tier2: true

    runs-on: ${{ matrix.os }}
    # windows-arm64 is a Tier-2 target; a build break omits its artifact
    # rather than failing the whole release.
    continue-on-error: ${{ matrix.tier2 == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p opi-coding-agent

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p opi-coding-agent

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/opi"
          [ "${{ matrix.ext }}" = "zip" ] && bin="$bin.exe"
          "$bin" --version

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz opi
        shell: bash

      - name: Package (windows)
        if: matrix.ext == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip opi.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  # Phase 16 task 16.15.2: opi-sandbox release archives for the native Linux +
  # macOS triples ONLY. Windows has no native opi-sandbox confinement (16.14.2
  # unsupported posture), so no Windows opi-sandbox artifact is produced. Only
  # native-runner triples are packaged (the 16.15.1 packager detects the HOST
  # triple; cross-arch packaging is a 16.15.1 follow-up). The ordinary six-target
  # Opi `build` matrix above is preserved unchanged. Smoke runs against the
  # EXTRACTED archive binary. The `release` job's `opi-*` glob + SHA256SUMS pick
  # these archives up alongside the Opi binaries.
  sandbox_archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build opi-sandbox release binary
        run: cargo build --release -p opi-sandbox --bin opi-sandbox

      - name: Package native archive
        shell: bash
        run: |
          bash scripts/package-opi-sandbox.sh \
            --binary target/release/opi-sandbox \
            --artifact-dir target/opi-artifacts/release-${{ matrix.os }}

      - name: Standalone smoke (extracted archive, no opi on PATH)
        shell: bash
        run: |
          bash scripts/opi-sandbox-smoke.sh \
            --binary target/opi-artifacts/release-${{ matrix.os }}/extracted/bin/opi-sandbox \
            --artifact-dir target/opi-artifacts/release-${{ matrix.os }}/smoke

      - name: Upload opi-sandbox archive
        uses: actions/upload-artifact@v4
        with:
          name: opi-sandbox-archive-${{ matrix.os }}
          path: target/opi-artifacts/release-${{ matrix.os }}/opi-sandbox-*.tar.gz

  release:
    needs: [build, sandbox_archive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum opi-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release upload "${RELEASE_TAG}" \
            opi-* \
            SHA256SUMS.txt \
            --clobber
