name: sandbox-macos-phase16

# Focused macOS verification for the Phase 16 task 16.14.1 Seatbelt/sandbox-exec
# native restriction. The standing ci.yml `test` matrix already runs
# `cargo test --workspace --all-targets` on macos-latest; this workflow is the
# clean SC16-11 + SC16-09b-macos signal (no pre-existing workspace-test debt in
# the pass/fail) plus the standalone-archive steps that no existing job covers.
# It is intentionally NARROW: a single macos-latest job, NO strategy.matrix, NO
# artifact upload, NO v* tag trigger (the six-target release matrix is 16.15.2;
# this is verification, not artifact publication). Triggered manually and on
# opi-sandbox/sandbox-script path pushes so a runtime fix can be verified
# without the whole workspace test job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/opi-sandbox/**'
      - 'scripts/package-opi-sandbox.sh'
      - 'scripts/opi-sandbox-smoke.sh'
      - '.github/workflows/sandbox-macos-phase16.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  sandbox-macos-phase16:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt (opi-sandbox)
        run: cargo fmt -p opi-sandbox --check
      - name: clippy (opi-sandbox)
        run: cargo clippy -p opi-sandbox --all-targets -- -D warnings
      # SC16-11: the macOS behavioral sentinels (macos_policy) + the posture-flip
      # lib/cli/standalone tests + the pure-profile model. Widened to
      # --all-targets so a green run coincides with ci.yml's opi-sandbox slice.
      - name: opi-sandbox tests (incl. macOS sentinels)
        run: cargo test -p opi-sandbox --all-targets
      # SC16-09b-macos: build, package, and standalone-smoke a native archive
      # against the extracted binary (target/protocol/hash match the extracted
      # bytes, asserted by package-opi-sandbox.sh --verify via 16.15.1 packaging).
      - name: build release binary
        run: cargo build --release -p opi-sandbox --bin opi-sandbox
      - name: package native archive
        run: |
          bash scripts/package-opi-sandbox.sh \
            --binary target/release/opi-sandbox \
            --artifact-dir target/opi-artifacts/phase16-macos
      - name: standalone smoke (extracted archive, no opi on PATH)
        run: |
          bash scripts/opi-sandbox-smoke.sh \
            --binary target/opi-artifacts/phase16-macos/extracted/bin/opi-sandbox \
            --artifact-dir target/opi-artifacts/phase16-macos/smoke
