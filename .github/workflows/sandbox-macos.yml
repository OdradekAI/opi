name: sandbox-macos

# Focused macOS verification for the Phase 15.5.4 sandbox-exec strict backend.
# The full CI matrix (ci.yml) already runs `cargo test --workspace` on
# macos-latest; this workflow is a fast iteration loop for the native macOS
# engaged product tests (sandbox-exec outside-write deny, network deny,
# workspace+temp allow) that need a real macOS kernel. Triggered manually and on
# sandbox-path pushes so a runtime fix can be verified without waiting on the
# whole workspace test job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/opi-coding-agent/src/sandbox/**'
      - 'crates/opi-coding-agent/src/sandbox.rs'
      - 'crates/opi-coding-agent/src/tool/operations.rs'
      - 'crates/opi-coding-agent/tests/sandbox_strict.rs'
      - '.github/workflows/sandbox-macos.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  sandbox-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (opi-coding-agent)
        run: cargo clippy -p opi-coding-agent --all-targets -- -D warnings
      - name: sandbox strict tests (incl. macOS engaged)
        run: cargo test -p opi-coding-agent --test sandbox_strict
