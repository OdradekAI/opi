[workspace]
members = [
    "crates/opi-ai",
    "crates/opi-agent",
    "crates/opi-coding-agent",
    "crates/opi-eval",
    "crates/opi-protocol",
    "crates/opi-sandbox",
    "crates/opi-tui",
]
resolver = "2"

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/OdradekAI/opi"
authors = ["OdradekAI"]

[workspace.dependencies]
opi-ai = { path = "crates/opi-ai", version = "0.8.3" }
opi-agent = { path = "crates/opi-agent", version = "0.8.3" }
opi-coding-agent = { path = "crates/opi-coding-agent", version = "0.8.3" }
opi-protocol = { path = "crates/opi-protocol", version = "0.8.3" }
opi-tui = { path = "crates/opi-tui", version = "0.8.3" }

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "signal", "process", "io-util", "io-std", "fs", "net"] }
tokio-util = "0.7"
futures-core = "0.3"
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
base64 = "0.22"

# errors
thiserror = "2"

# async traits

# HTTP/SSE
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
url = "2.5.8"
# Private WebSocket protocol machinery: the decoder owns the pinned Rust
# allocator and hidden SyncPoint/ResetKeep API; the encoder follows the
# caller's flate2 feature union. Source/feature changes require a new audit.
libz-rs-sys = { version = "=0.6.8", default-features = false, features = ["std", "rust-allocator"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

# Private schema dialect: upstream data profile, recorded under RDF-21.
# Preserve the selected ECMAScript API/features; consumers may unify features.
regress = { version = "=0.12.0", default-features = false, features = ["std", "utf16", "prohibit-unsafe"] }
unicode-normalization = "0.1.26"
# ECMAScript Number::toString for schema-argument string coercion; annex-pinned
# exact version (pure Rust, no build script, crate-internal unsafe only).
ryu-js = "=1.0.2"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# config
toml = "0.8"
semver = "1"

# TUI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

# schema
# Pinned to a minor so the opi-protocol schema snapshot (the normative
# command-execution-jsonl-v1 JSON Schema) cannot silently drift on a schemars
# minor bump; bumping requires re-reviewing that snapshot.
schemars = "1.2"
jsonschema = "0.28"

# IDs/time
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# file search
cap-std = "4.0.2"
ignore = "0.4"
globset = "0.4"
regex = "1"

# observability
tracing = "0.1"

# markdown
pulldown-cmark = "0.13"

# testing
tempfile = "3"
insta = "1"
wiremock = "0.6"
proptest = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }

# cryptography (SigV4 for Bedrock)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Private AWS STS protocol codecs (task 20.19.2, rust-backends §3.3): no I/O,
# no env/fs/network/trace, default features off. aws-smithy-xml's Document/
#ScopedDecoder reads only xmlparser-prechecked markup; xmlparser is also a
# direct dependency for the owned full lexical/structure precheck.
aws-smithy-query = { version = "=0.62.1", default-features = false }
aws-smithy-xml = { version = "=0.62.1", default-features = false }
xmlparser = "=0.13.5"
# CSPRNG for PKCE code_verifier/state (Phase 14.2 OAuth)
rand = "0.8"

# Upstream crypto profile (RDF-23, task 20.13): unmodified crates.io sources
# behind a private opi-ai signing owner. Exact baseline; upgrades require
# re-reviewing the native C/FFI closure (aws-lc-sys builds vendored AWS-LC C
# via cmake, static, non-FIPS). Transitive ring (reqwest rustls-tls) coexists;
# no process-global provider is installed by opi-ai.
rustls = { version = "=0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
# Exact existing transitive version for protocol-NACK loopback regressions.
h2 = "=0.4.14"
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["aws-lc-sys", "alloc", "prebuilt-nasm"] }

# env loading
dotenvy = "0.15"

# credential storage (Phase 14: OS keychain, cross-process lock, secret wrapper)
secrecy = "0.10"
zeroize = "1.8"
fs4 = { version = "1.1", features = ["tokio"] }
keyring-core = "1.0"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
windows-native-keyring-store = "1.1"
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-tokio-crypto-rust"] }

# Phase 15.4 L0 subprocess-tree lifecycle: process groups (Unix) + Job Objects (Windows)
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
      "Win32_Storage_FileSystem",
      "Win32_System_Diagnostics_ToolHelp",
      "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Linux strict substrate: seccomp deny-overlay + Landlock. Linux-only crates;
# referenced by the standalone opi-sandbox crate under cfg(target_os = "linux")
# (16.16.1 removed them from opi-coding-agent when native restriction left core).
landlock = "=0.4.5"
seccompiler = { version = "0.5", default-features = false }
