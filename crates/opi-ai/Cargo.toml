[package]
name = "opi-ai"
description = "Unified multi-provider LLM API with streaming support"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-core = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Private STS protocol codecs: form-query writer, bounded XML reader, and the
# lexical/structure precheck tokenizer (rust-backends §3.3 fixed selection).
aws-smithy-query = { workspace = true }
aws-smithy-xml = { workspace = true }
xmlparser = { workspace = true }
p256 = { workspace = true }
sha1 = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
regress = { workspace = true }
unicode-normalization = { workspace = true }
ryu-js = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
# Upstream crypto profile (RDF-23): private signing owner only; not re-exported.
rustls = { workspace = true }
aws-lc-rs = { workspace = true }
rustls-native-certs = { workspace = true }
libz-rs-sys = { workspace = true }
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security"] }

[dev-dependencies]
sha2 = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
secrecy = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
h2 = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
