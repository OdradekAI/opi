[package]
name = "opi-ai"
description = "Unified multi-provider LLM API with streaming support"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Built-in adapters, authentication backends and the bundled catalog are optional.
# The default retains the complete SDK; no-default keeps core + scripted Faux.
default = ["builtins", "telemetry-tracing"]
builtins = [
    "catalog-bundled",
    "protocol-adapters",
    "oauth-store",
]
# Built-in provider protocol adapters and protocol-owned signing/codecs, plus
# protocol-only TLS/WebSocket/compression dependencies. Concrete provider
# OAuth/store flows remain under `oauth-store`; `builtins` keeps depending on
# this owner for compatibility.
protocol-adapters = [
    "provider-anthropic",
    "provider-azure-openai",
    "provider-bedrock",
    "provider-gemini",
    "provider-mistral",
    "provider-openai-chat",
    "provider-openai-codex-responses",
    "provider-openai-responses",
    "provider-openrouter",
    "provider-pi-messages",
    "provider-vertex",
]
# Shared source/operation glue used by individually selectable provider
# protocol owners. This is an implementation feature; callers should select
# one of the provider-* features below or the compatibility group above.
provider-protocol-common = []
# OpenRouter wire usage/accounting types shared by OpenAI-compatible and
# Anthropic adapters. The implementation lives in `api::shared`; the public
# `providers::openrouter::*` path remains provider-owned.
provider-openrouter-usage = ["provider-protocol-common"]
# Individual provider protocol/source owners. Each owner keeps its own wire
# module selectable while reusing only the shared HTTP/auth/TLS seams it needs.
provider-anthropic = ["provider-protocol-common", "http-transport", "provider-openrouter-usage"]
provider-azure-openai = [
    "provider-protocol-common", "http-transport", "provider-openai-chat",
    "provider-openai-responses",
]
provider-bedrock = ["provider-protocol-common", "cloud-auth"]
provider-gemini = ["provider-protocol-common", "http-transport"]
provider-mistral = ["provider-protocol-common", "provider-openai-chat"]
provider-openai-chat = [
    "provider-protocol-common", "http-transport", "provider-openrouter-usage",
    "provider-openai-responses-shared",
]
provider-openai-codex-responses = [
    "provider-protocol-common", "provider-openai-responses-shared",
    "websocket-compression",
]
provider-openai-responses = [
    "provider-protocol-common", "http-transport", "provider-openai-responses-shared",
]
provider-openai-responses-shared = ["provider-protocol-common"]
provider-openrouter = ["provider-protocol-common", "provider-openai-chat"]
provider-pi-messages = ["provider-protocol-common", "http-transport"]
provider-vertex = ["provider-protocol-common", "provider-gemini", "cloud-auth"]
# Protocol-independent cloud credential sources and signing/codecs. This
# owner supplies AWS source chains/STS and GCP ADC families over shared HTTP;
# provider wire adapters remain under `protocol-adapters`.
cloud-auth = [
    "http-transport",
    "dep:hmac", "dep:aws-smithy-query", "dep:aws-smithy-xml",
    "dep:xmlparser", "dep:p256", "dep:sha1",
]
# Provider-owned OAuth flows and their store-backed login/refresh integration.
# Neutral credential values, mutation, store, and OAuth trait contracts remain
# available from core; this owner only adds the concrete provider flows.
oauth-store = [
    "http-transport",
]
# The embedded opi model catalog is independently selectable. `builtins` keeps
# depending on this feature so existing explicit-builtins consumers retain the
# same public registration surface and default behavior.
catalog-bundled = []
# Shared HTTP transport. Provider protocol adapters and provider OAuth/store
# remain separate and transitively select this feature. The TLS backend is an
# independent owner so callers that only need source-scoped TLS configuration
# do not acquire reqwest.
http-transport = [
    "tls-backend", "dep:reqwest", "dep:windows-sys",
]
# Fixed rustls/AWS-LC source-scoped backend used by `TlsOptions`. This owner
# exposes the typed TLS configuration module without selecting HTTP transport.
tls-backend = [
    "dep:rustls", "dep:aws-lc-rs", "dep:rustls-native-certs",
]
# Source-scoped WebSocket Upgrade, RFC 6455 framing and permessage-deflate
# owner. This is independently selectable for callers that need the public
# `opi_ai::ws` bridge without provider protocol adapters; it transitively
# reuses the shared HTTP/TLS owners.
websocket-compression = [
    "http-transport", "dep:libz-rs-sys", "dep:flate2",
]
telemetry-tracing = ["opi-telemetry/tracing"]

[dependencies]
opi-telemetry = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
# Final argument consumers and session roundtrips need correctly rounded floats.
# Cargo unifies this feature with callers using the same serde_json version.
serde_json = { workspace = true, features = ["float_roundtrip"] }
base64 = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
http = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Private STS protocol codecs: form-query writer, bounded XML reader, and the
# lexical/structure precheck tokenizer (rust-backends §3.3 fixed selection).
aws-smithy-query = { workspace = true, optional = true }
aws-smithy-xml = { workspace = true, optional = true }
xmlparser = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
rand = { workspace = true }
regex = { workspace = true }
regress = { workspace = true }
unicode-normalization = { workspace = true }
ryu-js = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
# Upstream crypto profile (RDF-23): private signing owner only; not re-exported.
rustls = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
libz-rs-sys = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_Security"] }

[dev-dependencies]
tracing-core = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
secrecy = { workspace = true }
tokio-rustls = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
h2 = { workspace = true }
rustls = { workspace = true, features = ["ring"] }

