# Initialize with the supplied runtime entry point; edit one private profile.
schema = "opi-eval-operator/2"

[model]
provider = "zhipu"
model = "glm-5.3-flash"
api = "anthropic-messages"
base_url = "https://open.bigmodel.cn/api/anthropic"
credential_env = "ZHIPU_API_KEY"
# Exactly one credential source: credential_env, credential_file (absolute), api_key.
# api_key belongs only in the ignored private profile, never in this template.

[model.controls]
context_window = 1000000
max_output_tokens = 131072
temperature = "omitted"
top_p = "omitted"

[model.thinking]
# Native levels: off, minimal, low, medium, high, xhigh, max; omitted is an
# operator marker, not a pi level, and cannot be required. Enabled levels need
# budget + 1024 output tokens; exact-client wire proof checks effective support.
level = "off"
required = true

[execution]
trial_retries = 2
batch_timeout_seconds = 3600
concurrency = 1
capture_policy = "full"

[benchmarks.tb21]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[benchmarks.tb30]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[benchmarks.deepswe]
scope = "full"
repetitions = 1
task_ids = []
seeds = {}

[baseline]
pi_version = "1.0.0"
lookup = "auto"
# 0 disables age exclusion. Historical scores remain unchanged when stale.
max_age_days = 0

[retention]
# Finished evaluations roll ordinary history down to this count per kind.
# Active/pinned/referenced evidence and unresolved cleanup remain protected.
keep_latest_per_group = 3

[storage]
# Native prepare/run requires Linux x86_64 and Docker. Choose external Linux paths.
workspace = "/home/luiz/.local/state/opi-eval"
cache = "/home/luiz/.cache/opi-eval"
