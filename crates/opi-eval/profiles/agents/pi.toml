# Declarative pi agent profile for opi-eval.
# Identity, launch policy, environment projection keys, and limits only:
# no protocol behavior, no parser configuration, no credentials.
# Pinned to the earendil-works coding-agent v0.84.3 CLI surface.

schema = "opi-eval-agent-profile/1"
product = "pi"

[identity]
package = "@earendil-works/pi-coding-agent"
adapter = "opi-eval-pi-adapter/1"

[launch]
one_shot_json = true
non_interactive = true
trace_capture = true
no_trust = true
thinking_level = "off"

[isolation]
home_env = "HOME"
app_data_env = "USERPROFILE"
sessions_env = "PI_CODING_AGENT_SESSION_DIR"
agent_dir_env = "PI_CODING_AGENT_DIR"

[limits]
timeout_secs = 900
stdout_cap_bytes = 1048576
stderr_cap_bytes = 1048576
