schema = "opi-eval-benchmark-profile/1"
benchmark = "deepswe"
revision = "v1.1"

[identity]
upstream = "https://github.com/datacurve-ai/deep-swe"
# DeepSWE v1.1 has no Git tag. The semantic version anchor is the explicit
# "DeepSWE V1.1" commit; the executable revision adds the
# [[verifier.collect]] patch handoff the Phase design requires. Neither may
# be presented as a tag.
version_anchor = "8cae5984d5dd0ee37445beff0e928dc10c331116"
source_commit = "435ee89ec2f2e2289f33b0da4f992f0b7b7266b9"
tasks_tree = "66df25a1b382017d0ae014d94cadb2698baaed48"
task_id = "opa-template-string-reconstruction"
task_tree = "dfbaf7af531adc463503770ac0cc0431a72bcd04"
# The static external lock pins DeepSWE v1.1 by task-tree identity with an
# empty files table; this profile registers the selected task's materialized
# byte table for exact-set and exact-byte package admission.
package_pin = "byte-table"
package_manifest_sha256 = "95915a95d6ecc6e63aba815007eca45fd5fcbc4382808033461803ce2e87beb5"
adapter = "opi-eval-deepswe-adapter/1"

[verifier]
# DeepSWE's pinned instruction selects Pier (newer than 0.3.0) for patch
# collection and the pristine separate verifier; the lock records the exact
# Pier uv.lock blob and digest so `uv run --locked` resolves only that
# closure. The launch argv is re-pinned against the pinned Pier CLI
# (`pier run --path/-p <dir>`; the CLI takes no positional task path),
# verified against the pinned checkout's own --help output.
runner_kind = "pier"
runner_version = "v0.3.1"
runner_commit = "c1ebc6d145b40fae8425215e3fca528945065124"
runner_uv_lock_blob = "762c6e2c3410021edefe50ce93d9a5d341821b50"
runner_uv_lock_sha256 = "0983c4376bb818a984b80badd28886c204c78875e0112387efb03af401ad86c0"
launch = ["run", "-p", "<task-dir>"]
# The mutable agent worktree is never graded directly: the declared
# collected patch is graded in a pristine verifier environment with no
# network. The final verifier image is a run-produced native-smoke slot.
lifecycle = "separate-pristine-verifier"
network = "none"
artifact_policy = "collected-patch"
# The pinned native output is Pier's own `jobs/<job>/result.json`
# aggregate from `pier run -p`: the same one-trial shape the shared
# native-result contract imports (P19-D04).
output_kind = "pier-job-aggregate"

[resources]
cpus = 2
memory_gib = 8

[limits]
# Whole Pier job. Decomposition from the selected task's own contract
# (task.toml): environment build 1800s + agent 5400s + patch collection 300s
# + verifier environment build 1800s + pristine verifier 1800s = 11100s,
# plus 900s slack. Zhipu's DeepSWE v1.1 harness budget (6h per task,
# research 163) remains an upper bound this pin never needs: the task's
# own agent timeout (5400s) binds first and fails closed.
timeout_secs = 12000
stdout_cap_bytes = 1048576
stderr_cap_bytes = 1048576

