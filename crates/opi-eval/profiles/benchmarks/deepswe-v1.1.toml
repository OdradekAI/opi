schema = "phase18-benchmark-profile/1"
benchmark = "deepswe"
revision = "v1.1"

[identity]
upstream = "https://github.com/datacurve-ai/deep-swe"
# DeepSWE v1.1 has no Git tag. The semantic version anchor is the explicit
# "DeepSWE V1.1" commit; the executable revision adds the
# [[verifier.collect]] patch handoff the Phase design requires. Neither may
# be presented as a tag.
version_anchor = "8cae5984d5dd0ee37445beff0e928dc10c331116"
source_commit = "435ee89ec2f2e2289f33b0da4f992f0b7b7266b9"
tasks_tree = "66df25a1b382017d0ae014d94cadb2698baaed48"
task_id = "abs-module-cache-flags"
task_tree = "8ee76a3e4a876a9bd24f34edabcdde4e47257db4"
# The static external lock pins DeepSWE v1.1 by task-tree identity with an
# empty files table. No byte-level task-package table is committed, so the
# production pin is tree-identity only and admission fails closed until
# task 18.15 registers reviewed bytes.
package_pin = "byte-table"
package_manifest_sha256 = "a21f63f43013fed09a930473d10e51a7f419954554b1bf759733d5f0ba0df095"
adapter = "opi-eval-deepswe-adapter/1"

[verifier]
# DeepSWE's pinned instruction selects Pier (newer than 0.3.0) for patch
# collection and the pristine separate verifier; the lock records the exact
# Pier uv.lock blob and digest so `uv run --locked` resolves only that
# closure. The launch argv below is a structural pin: no Pier CLI text is
# committed as evidence yet, and production admission fails closed before
# any spawn; task 18.15 re-pins it against the pinned README and Pier CLI.
runner_kind = "pier"
runner_version = "v0.3.1"
runner_commit = "c1ebc6d145b40fae8425215e3fca528945065124"
runner_uv_lock_blob = "762c6e2c3410021edefe50ce93d9a5d341821b50"
runner_uv_lock_sha256 = "0983c4376bb818a984b80badd28886c204c78875e0112387efb03af401ad86c0"
launch = ["run", "<task-dir>"]
# The mutable agent worktree is never graded directly: the declared
# collected patch is graded in a pristine verifier environment with no
# network. The final verifier image is a run-produced 18.15 slot.
lifecycle = "separate-pristine-verifier"
network = "none"
artifact_policy = "collected-patch"
# No DeepSWE native-output schema is committed. Nothing is guessed or
# normalized until task 18.15 registers the real schema.
output_kind = "unpinned-pending-18-15"

[resources]
cpus = 2
memory_gib = 8

[limits]
timeout_secs = 1800
stdout_cap_bytes = 1048576
stderr_cap_bytes = 1048576

