# Hermetic DeepSWE v1.1 experiment for the assembled run path (opi-eval
# the assembled runner). The DeepSWE adapter pins a tree-identity task package that
# is not materialized until the native smoke, so the honest assembled run settles
# as the typed admission refusal below, never a fallback verifier.

schema = "opi-eval-experiment/1"
experiment_id = "deepswe-hermetic"

[benchmark]
name = "deepswe"
revision = "v1.1"
dataset = "deepswe-v1.1-fixture"
# Content-addressed identity of the fixture integrity review the runner
# builds for this document (pinned by a unit test in runner::experiment).
integrity_digest = "6e2d9b1cc259a2364b9205c7b7d87d99b96f1cc98b6a478527c0be6bfd311c09"

[[subjects]]
id = "baseline-pi"
product = "pi"
version = "0.84.3"

[[subjects]]
id = "candidate-opi"
product = "opi"
version = "0.1.0"

[[edges]]
id = "edge-1"
baseline = "baseline-pi"
candidate = "candidate-opi"

[model_controls]
provider = "local"
model = "scripted"
endpoint_class = "local"
temperature = 0.0
max_output_tokens = 4096
# Omitted: neither pinned profile expresses a reasoning control for this
# experiment, so no subject is asked to realize one.
reasoning = "omitted"

[environment]
platform = "linux"
architecture = "x86_64"
cwd_policy = "isolated"

[[trials]]
id = "trial-pi-1"
subject = "baseline-pi"
task = "synthetic-fixture-task"
group = "group-hello"

[[trials]]
id = "trial-opi-1"
subject = "candidate-opi"
task = "synthetic-fixture-task"
group = "group-hello"
