# EVAL-A20 fixture: a three-harness-subject experiment whose benchmark
# descriptor is a fourth, not-yet-admitted revision. Nothing here is one of
# the three admitted opi-eval revisions (Terminal-Bench 2.1/3.0, DeepSWE
# v1.1): the benchmark carries no integrity_digest, so resolution keeps it
# provisional, and `future-agent` is not a registered process adapter, so
# the runner would fail closed with UnsupportedSubject long before any
# execution. The point is structural: the frozen contract must accept a
# third harness subject and a fourth benchmark revision without hard-coding
# the admitted set (EVAL-RDM-002).

schema = "opi-eval-experiment/2"
experiment_id = "generic-three-subject-fourth-benchmark"
connection = "fixture-local"

[benchmark]
name = "frontier-bench"
revision = "0.9"
dataset = "frontier-bench-fixture"
# No integrity_digest: the revision is not admitted, so the descriptor
# resolves but stays provisional.

[[subjects]]
id = "baseline-pi"
product = "pi"
version = "0.84.3"

[[subjects]]
id = "candidate-opi"
product = "opi"
version = "0.1.0"

[[subjects]]
id = "future-generic"
product = "future-agent"
version = "9.9.0"

[[edges]]
id = "edge-pi-generic"
baseline = "baseline-pi"
candidate = "future-generic"

[[edges]]
id = "edge-generic-opi"
baseline = "future-generic"
candidate = "candidate-opi"

[[connections]]
id = "fixture-local"
provider = "local"
api = "openai-completions"
base_url = "http://127.0.0.1:48127/v1"
model = "scripted"
credential_env = "OPI_EVAL_FIXTURE_KEY"

[model_controls]
temperature = 0.0
top_p = "omitted"
max_output_tokens = 4096
context_window = 8192
reasoning = "omitted"

[storage]
cache = "cache"
results = "results"
capture_policy = "full"
[environment]
platform = "linux"
architecture = "x86_64"
cwd_policy = "isolated"

[[trials]]
id = "trial-pi-g1"
subject = "baseline-pi"
task = "fixture-task"
group = "group-one"

[[trials]]
id = "trial-generic-g1"
subject = "future-generic"
task = "fixture-task"
group = "group-one"

[[trials]]
id = "trial-generic-g2"
subject = "future-generic"
task = "fixture-task"
group = "group-two"

[[trials]]
id = "trial-opi-g2"
subject = "candidate-opi"
task = "fixture-task"
group = "group-two"
