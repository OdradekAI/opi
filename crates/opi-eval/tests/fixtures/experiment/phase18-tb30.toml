# Hermetic Terminal-Bench 3.0 experiment for the assembled run path
# (Phase 18 task 18.12). The 3.0 adapter pins a tree-identity task package
# that is not materialized until task 18.15, so the honest assembled run
# settles as the typed admission refusal below, never a fallback verifier.

schema = "phase18-experiment/1"
experiment_id = "phase18-tb30-hermetic"

[benchmark]
name = "terminal-bench"
revision = "3.0"
dataset = "terminal-bench-3.0-fixture"
# Content-addressed identity of the fixture integrity review the runner
# builds for this document (pinned by a unit test in runner::experiment).
integrity_digest = "f72ac2addb4ad8832df50385735280f702cafb2bfd873df7e88d258d4bd75108"

[[subjects]]
id = "baseline-pi"
product = "pi"
version = "0.84.3"

[[subjects]]
id = "candidate-opi"
product = "opi"
version = "0.1.0"

[[edges]]
id = "edge-1"
baseline = "baseline-pi"
candidate = "candidate-opi"

[model_controls]
provider = "local"
model = "scripted"
endpoint_class = "local"
temperature = 0.0
max_output_tokens = 4096
# Omitted: neither pinned profile expresses a reasoning control for this
# experiment, so no subject is asked to realize one.
reasoning = "omitted"

[environment]
platform = "linux"
architecture = "x86_64"
cwd_policy = "isolated"

[[trials]]
id = "trial-pi-1"
subject = "baseline-pi"
task = "synthetic-fixture-task"
group = "group-hello"

[[trials]]
id = "trial-opi-1"
subject = "candidate-opi"
task = "synthetic-fixture-task"
group = "group-hello"
