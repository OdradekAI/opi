[package]
name = "consumer-crypto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The packaged opi-ai artifact extracted by package_slice.py. Only this SDK
# path is substituted; backend dependencies resolve from crates.io.
opi-ai = { path = "@PACKAGE@" }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde_json = "=1.0.149"
rustls = { version = "=0.23.40", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = "=0.26.4"
hyper = { version = "=1.9.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "server"] }
http-body-util = "=0.1.3"
futures-util = "=0.3.32"
secrecy = "=0.10.3"
tokio-util = "=0.7.18"

[features]
# Caller feature-union control: the consumer's own graph additionally
# enables the rustls ring backend and installs it as the process-global
# provider, proving the SDK's instance TLS is independent of host state.
caller-union = ["rustls/ring"]
