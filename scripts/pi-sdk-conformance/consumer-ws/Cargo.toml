[package]
name = "consumer-ws"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The actual extracted SDK artifact. The public API currently proves
# strict Upgrade and the detached raw stream; the codec remains private.
opi-ai = { path = "@PACKAGE@" }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-util = "=0.7.18"
secrecy = "=0.10.3"
serde_json = "=1.0.149"
url = "=2.5.8"
base64 = "=0.22.1"
aws-lc-rs = { version = "=1.18.2", default-features = false }
# Caller-owned feature-union control; no test features enter the SDK API.
flate2 = { version = "=1.1.10", default-features = false }

[features]
union-default = ["flate2/default"]
union-c-zlib = ["flate2/zlib"]
