[package]
name = "opi-sdk-conformance-consumer"
version = "0.0.0"
edition = "2024"
publish = false

# The runner substitutes the extracted `cargo package` artifact, not the
# workspace source. All backend dependencies use ordinary crates.io identities.
[dependencies]
opi-ai = { path = "@PACKAGE@" }
url = "=2.5.8"
regress = { version = "=0.12.0", default-features = false, features = ["std", "utf16", "prohibit-unsafe"] }
serde_json = "1"

[features]
caller-default-regress = ["regress/default"]

[workspace]
